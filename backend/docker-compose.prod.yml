# Stack de production pour le VPS — à placer dans ${VPS_DEPLOY_PATH} (voir
# backend/README.md, section "Déploiement continu (VPS + GitHub Actions)").
# Contrairement à docker-compose.yml (dev local, build: .), ce fichier tire
# l'image déjà construite et publiée sur GHCR par le workflow backend-deploy.yml.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: plateforme_taches
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d plateforme_taches"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

  app:
    image: ghcr.io/yvesleopoldbeugre/plateforme-taches-remunerees-backend:${IMAGE_TAG:-latest}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/plateforme_taches
      DB_USERNAME: platform
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_BOOTSTRAP_SECRET: ${ADMIN_BOOTSTRAP_SECRET:-}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-mail.notetaboite.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Plateforme de Tâches Rémunérées}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER_NAME_ID: ${SMS_SENDER_NAME_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.task-platform.rule=Host(`task.notetaboite.com`)"
      - "traefik.http.routers.task-platform.entrypoints=websecure"
      - "traefik.http.routers.task-platform.tls=true"
      - "traefik.http.routers.task-platform.tls.certresolver=letsencrypt"
      - "traefik.http.services.task-platform.loadbalancer.server.port=8080"

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
  # Réseau du Traefik déjà déployé sur le VPS (créé hors de ce compose).
  traefik-public:
    external: true
