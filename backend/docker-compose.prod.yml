# Stack de production pour le VPS — à placer dans ${VPS_DEPLOY_PATH} (voir
# backend/README.md, section "Déploiement continu (VPS + GitHub Actions)").
# Contrairement à docker-compose.yml (dev local, build: .), ce fichier tire
# l'image déjà construite et publiée sur GHCR par le workflow backend-deploy.yml.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: plateforme_taches
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d plateforme_taches"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    image: ghcr.io/yvesleopoldbeugre/plateforme-taches-remunerees-backend:${IMAGE_TAG:-latest}
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/plateforme_taches
      DB_USERNAME: platform
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_BOOTSTRAP_SECRET: ${ADMIN_BOOTSTRAP_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
