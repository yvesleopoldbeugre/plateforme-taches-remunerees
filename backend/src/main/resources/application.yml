spring:
  application:
    name: plateforme-taches-remunerees

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plateforme_taches}
    username: ${DB_USERNAME:platform}
    password: ${DB_PASSWORD:platform}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # SMTP transport for MailService — only actually used when notifications.enabled=true.
  # Same mailbox/account as the note-ta-boite project (shared SMTP, distinct From name below).
  mail:
    host: ${MAIL_HOST:mail.notetaboite.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            # Certificat mutualisé LWS (*.lwspanel.com) ≠ host SMTP — même limitation que
            # MAIL_VERIFY_PEER=false côté note-ta-boite.
            trust: ${MAIL_HOST:mail.notetaboite.com}

server:
  port: ${SERVER_PORT:8080}

jwt:
  # Dev-only default — MUST be overridden (32+ bytes, high-entropy) outside local development.
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-32bytes-min}
  access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
  refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}

platform:
  withdrawal:
    # BR-043 (DAT §4.2/§11) names these rules but not their values — hypotheses explicites,
    # tranchées here (XOF), same as TaskTypes/RejectionReasons before. Override via env in prod.
    minimum-amount: ${WITHDRAWAL_MINIMUM_AMOUNT:1000}
    fee-rate: ${WITHDRAWAL_FEE_RATE:0.015}
    manual-review-threshold: ${WITHDRAWAL_MANUAL_REVIEW_THRESHOLD:50000}
  admin:
    # Empty by default: POST /api/v1/admin/bootstrap refuses outright until this is set — see
    # AdminBootstrapService. Set it once in the target environment, bootstrap the first
    # PLATFORM_ADMIN, then rotate/unset it; the endpoint also self-disables once any admin exists.
    bootstrap-secret: ${ADMIN_BOOTSTRAP_SECRET:}

# Real email/SMS off by default (LoggingVerificationNotifier) so local dev and tests never
# depend on a live SMTP/SMS account. Set to true only where MAIL_*/SMS_* below are configured.
notifications:
  enabled: ${NOTIFICATIONS_ENABLED:false}

mail:
  from-name: ${MAIL_FROM_NAME:Plateforme de Tâches Rémunérées}

# Djosend — même compte/API que le projet mon-point. sender-name-id est l'UUID du sender name
# "MONPOINTCI" déjà créé et approuvé dans le portail Djosend (GET /api/v1/sender-names) ; le
# champ senderName (string) de l'ancienne route /sms/messages est déprécié et ignoré par l'API.
sms:
  base-url: ${SMS_BASE_URL:https://api.djosend.com/api/v1/messages}
  api-key: ${SMS_API_KEY:}
  sender-name-id: ${SMS_SENDER_NAME_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId}] %-5level %logger{36} - %msg%n"
